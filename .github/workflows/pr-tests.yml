name: PR Tests

permissions:
  contents: read
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: 'Git ref to compare against (changed Go packages only)'
        required: true
        default: origin/main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '**/*.go'
      - 'internal/**'
      - 'scripts/pipeline/pr/**'
      - 'scripts/pipeline/generate_test_factories.py'
      - 'scripts/pipeline/tests/**'
      - 'scripts/pipeline/bi_weekly_tests/**'
      - '.github/workflows/pr-tests.yml'
      - '.github/workflows/bi-weekly-tests.yml'

concurrency:
  group: go-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOMAXPROCS: '1'
  GOFLAGS: '-p=1'
  TF_ACC: '0'
  PYTHONUNBUFFERED: '1'

jobs:
  plan-tests:
    name: '📋 Plan test partitions'
    runs-on: ubuntu-24.04-arm
    outputs:
      has-changes: ${{ steps.plan.outputs.has-changes }}
      has-goroutines: ${{ steps.plan.outputs.has-goroutines }}
      service-domains: ${{ steps.plan.outputs.service-domains }}
      unit-matrix: ${{ steps.plan.outputs.unit-matrix }}
      unit-shards: ${{ steps.plan.outputs.unit-shards }}
      unit-packages: ${{ steps.plan.outputs.unit-packages }}
      race-packages: ${{ steps.plan.outputs.race-packages }}
      race-matrix: ${{ steps.plan.outputs.race-matrix }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'
          cache: false

      - name: '🔎 Verify isolated test factories'
        run: |
          python3 -m unittest discover -s scripts/pipeline/tests -v
          python3 scripts/pipeline/generate_test_factories.py --check

      - name: '📦 Detect changed packages and plan Go jobs'
        id: plan
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || inputs.base_ref }}
        run: python3 scripts/pipeline/pr/steps/plan_jobs.py --base-ref "$BASE_REF"

      - name: Verify coverage reporting
        run: python3 -m unittest discover -s scripts/pipeline/pr/tests -p 'test_*coverage*.py' -v

      - name: Verify pipeline resource diagnostics
        run: |
          python3 -m unittest discover -s scripts/pipeline/pr/tests -p test_monitor_resources.py -v
          python3 -m unittest discover -s scripts/pipeline/bi_weekly_tests/tests -v

      - name: Verify cache preparation
        run: python3 -m unittest discover -s scripts/pipeline/pr/tests -p test_prepare_go_cache.py -v

      - name: Verify test runner
        run: |
          python3 -m unittest discover -s scripts/pipeline/pr/tests -p test_go_tests.py -v
          python3 -m unittest discover -s scripts/pipeline/pr/tests -p test_partitions.py -v

  prepare-build-cache:
    name: '📦 Prepare test build cache'
    needs: plan-tests
    if: needs.plan-tests.outputs.has-changes == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    outputs:
      cache-key: ${{ steps.identity.outputs.key }}
      mod-cache: ${{ steps.identity.outputs.mod-cache }}
      build-cache: ${{ steps.identity.outputs.build-cache }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        id: go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: '🔑 Identify the prepared snapshot'
        id: identity
        env:
          CACHE_PLATFORM: ${{ runner.os }}-${{ runner.arch }}
          GO_VERSION: ${{ steps.go.outputs.go-version }}
          DEPENDENCIES: ${{ hashFiles('go.mod', 'go.sum', 'scripts/pipeline/pr/steps/prepare_go_cache.py') }}
          RUN_RACE: ${{ needs.plan-tests.outputs.has-goroutines == 'true' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false) }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mode=normal
          if [ "$RUN_RACE" = true ]; then mode=normal-race; fi
          prefix="go-test-build-v1-$CACHE_PLATFORM-$GO_VERSION-$DEPENDENCIES-$mode-"
          echo "mod-cache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build-cache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "legacy-prefix=setup-go-${RUNNER_OS}-${RUNNER_ARCH,,}-${ImageOS}-go-$GO_VERSION-" >> "$GITHUB_OUTPUT"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "key=$prefix$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: '📥 Restore prior dependency artifacts'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ steps.identity.outputs.mod-cache }}
            ${{ steps.identity.outputs.build-cache }}
          key: ${{ steps.identity.outputs.key }}
          restore-keys: |
            ${{ steps.identity.outputs.prefix }}
            ${{ steps.identity.outputs.legacy-prefix }}

      - name: '🏗️ Prepare normal test dependencies'
        timeout-minutes: 45
        env:
          PACKAGES: ${{ needs.plan-tests.outputs.unit-packages }}
        run: |
          bash scripts/pipeline/pr/steps/monitor_resources.sh cache-results/normal \
            python3 scripts/pipeline/pr/steps/prepare_go_cache.py --packages "$PACKAGES"

      - name: '🏗️ Prepare race test dependencies'
        if: needs.plan-tests.outputs.has-goroutines == 'true' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false)
        timeout-minutes: 45
        env:
          PACKAGES: ${{ needs.plan-tests.outputs.race-packages }}
        run: |
          bash scripts/pipeline/pr/steps/monitor_resources.sh cache-results/race \
            python3 scripts/pipeline/pr/steps/prepare_go_cache.py --packages "$PACKAGES" --race

      - name: Upload cache preparation diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-cache-preparation
          path: cache-results/
          if-no-files-found: ignore

  unit-test-shards:
    name: '🧪 Unit Test Partition ${{ matrix.shard_index }}'
    needs: [plan-tests, prepare-build-cache]
    if: needs.plan-tests.outputs.has-changes == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan-tests.outputs.unit-matrix) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'
          cache: false

      - name: '📥 Restore the prepared test build cache'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ needs.prepare-build-cache.outputs.mod-cache }}
            ${{ needs.prepare-build-cache.outputs.build-cache }}
          key: ${{ needs.prepare-build-cache.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: ⚙️ Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 'latest'
          terraform_wrapper: false

      - name: 🧪 Run unit tests
        timeout-minutes: 50
        id: tests
        env:
          PACKAGES: ${{ matrix.packages }}
        run: |
          export TF_ACC_TERRAFORM_PATH="$(command -v terraform)"
          bash scripts/pipeline/pr/steps/monitor_resources.sh coverage/diagnostics \
            python3 scripts/pipeline/pr/steps/run_tests.py \
            --packages "$PACKAGES" --output-dir coverage

      - name: Upload unit test reports and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-results-${{ matrix.shard_index }}
          path: coverage/
          if-no-files-found: ignore

      - name: Summarize unit test failure
        if: failure() && steps.tests.outcome == 'failure'
        run: |
          echo 'Unit tests or compilation failed. See unit-test-results for the test output and runner diagnostics; coverage does not override test failures.' >> "$GITHUB_STEP_SUMMARY"


  unit-tests:
    name: '🧪 Go Unit Tests & Coverage'
    runs-on: ubuntu-24.04-arm
    needs: [plan-tests, prepare-build-cache, unit-test-shards]
    if: always()
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: '✅ Require every unit partition to pass'
        env:
          PLAN: ${{ needs.plan-tests.result }}
          CACHE: ${{ needs.prepare-build-cache.result }}
          HAS_CHANGES: ${{ needs.plan-tests.outputs.has-changes }}
          RESULT: ${{ needs.unit-test-shards.result }}
        run: |
          test "$PLAN" = success
          if [ "$HAS_CHANGES" = true ]; then
            test "$CACHE" = success
            test "$RESULT" = success
          fi

      - name: '📥 Download shard coverage'
        if: needs.plan-tests.outputs.has-changes == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unit-test-results-*
          path: shard-coverage

      - name: '📊 Merge successful shard coverage'
        if: needs.plan-tests.outputs.has-changes == 'true'
        env:
          EXPECTED_SHARDS: ${{ needs.plan-tests.outputs.unit-shards }}
        run: python3 scripts/pipeline/pr/steps/merge_coverage.py --artifacts shard-coverage --output coverage/unit-coverage.txt --expected-shards "$EXPECTED_SHARDS"

      - name: Check if PR is draft
        id: pr-state
        if: needs.plan-tests.outputs.has-changes == 'true'
        run: |
          if [ "${{ github.event.pull_request.draft }}" == "true" ]; then
            echo "is-draft=true" >> $GITHUB_OUTPUT
            echo "📝 PR is in draft state - tests are informational only"
          else
            echo "is-draft=false" >> $GITHUB_OUTPUT
            echo "✅ PR is ready for review - enforcing coverage threshold"
          fi

      - name: 📊 Calculate local coverage
        id: calculate-coverage
        if: needs.plan-tests.outputs.has-changes == 'true'
        run: |
          python3 scripts/pipeline/pr/steps/calculate_coverage.py \
            --coverage-file coverage/unit-coverage.txt

      - name: ⬆️ Upload coverage to Codecov
        if: |
          github.event_name == 'pull_request' &&
          needs.plan-tests.outputs.has-changes == 'true' &&
          steps.pr-state.outputs.is-draft == 'false'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/unit-coverage.txt
          flags: unittests,pr-changes
          name: pr-unit-coverage
          fail_ci_if_error: false

      - name: ✅ Enforce coverage threshold
        id: enforce-coverage
        if: |
          github.event_name == 'pull_request' &&
          needs.plan-tests.outputs.has-changes == 'true' &&
          steps.pr-state.outputs.is-draft == 'false'
        env:
          CODECOV_API_TOKEN: ${{ github.event.repository.private && secrets.CODECOV_API_TOKEN || '' }}
        run: |
          python3 scripts/pipeline/pr/steps/enforce_coverage.py \
            --repo-slug "${{ github.repository }}" \
            --pr-number "${{ github.event.pull_request.number }}" \
            --commit-sha "${{ github.event.pull_request.head.sha }}"

      - name: 💬 Comment coverage summary on PR
        if: github.event_name == 'pull_request' && needs.plan-tests.outputs.has-changes == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const patchCoverage = '${{ steps.enforce-coverage.outputs.coverage-pct }}';
            const coveragePct = patchCoverage || '${{ steps.calculate-coverage.outputs.coverage-pct }}';
            const totalLines = '${{ steps.enforce-coverage.outputs.total-lines || steps.calculate-coverage.outputs.total-lines }}';
            const coveredLines = '${{ steps.enforce-coverage.outputs.covered-lines || steps.calculate-coverage.outputs.covered-lines }}';
            const coverageScope = patchCoverage ? 'Changed Lines (Codecov Patch)' : 'Changed Packages';
            const countUnit = patchCoverage ? 'Lines' : 'Statements';
            const serviceDomains = '${{ needs.plan-tests.outputs.service-domains }}';
            const isDraft = '${{ steps.pr-state.outputs.is-draft }}' === 'true';
            const minThreshold = 60;

            const passEmoji = parseFloat(coveragePct) >= minThreshold ? '✅' : '❌';
            const statusText = isDraft
              ? '📝 **Draft PR** - Coverage is informational only'
              : parseFloat(coveragePct) >= minThreshold
                ? `${passEmoji} **Coverage Passed** - Meets ${minThreshold}% threshold`
                : `${passEmoji} **Coverage Failed** - Below ${minThreshold}% threshold`;

            const body = `## 📊 Unit Test Coverage Report

            ${statusText}

            **Coverage for ${coverageScope}:** ${coveragePct}%

            - **Total ${countUnit}:** ${totalLines}
            - **Covered ${countUnit}:** ${coveredLines}
            - **Service Domains:** ${serviceDomains || 'N/A'}

            ${isDraft ? '> 💡 Mark PR as ready for review to enforce coverage threshold' : ''}
            ${parseFloat(coveragePct) < minThreshold && !isDraft ? `> ⚠️  Please add tests to reach ${minThreshold}% coverage` : ''}

            > Note: This is unit test coverage only. Full acceptance test coverage is run bi-weekly and includes integration with Microsoft Graph API.

            [View detailed coverage report on Codecov](https://codecov.io/gh/${{ github.repository }}/pull/${{ github.event.pull_request.number }})
            `;

            await core.summary.addRaw(body).write();
            // Fork and Dependabot PRs receive a read-only GITHUB_TOKEN.
            // Keep their report in the job summary without attempting a write.
            if (context.payload.pull_request.head.repo.full_name !== context.payload.repository.full_name ||
                context.actor === 'dependabot[bot]') {
              core.info('Coverage report saved to job summary; PR token is read-only.');
              return;
            }

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Unit Test Coverage Report')
            );

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

  race-shards:
    name: '🔍 Race Detection — partition ${{ matrix.shard_index }}'
    runs-on: ubuntu-24.04-arm
    needs: [plan-tests, prepare-build-cache]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan-tests.outputs.race-matrix) }}
    if: |
      needs.plan-tests.outputs.has-goroutines == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false)
    timeout-minutes: 60
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'
          cache: false

      - name: '📥 Restore the prepared test build cache'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ needs.prepare-build-cache.outputs.mod-cache }}
            ${{ needs.prepare-build-cache.outputs.build-cache }}
          key: ${{ needs.prepare-build-cache.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: ⚙️ Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 'latest'
          terraform_wrapper: false

      - name: 🔍 Run race detection
        timeout-minutes: 50
        env:
          PACKAGES: ${{ matrix.packages }}
        run: |
          export TF_ACC_TERRAFORM_PATH="$(command -v terraform)"
          bash scripts/pipeline/pr/steps/monitor_resources.sh race-results \
            python3 scripts/pipeline/pr/steps/run_race_detection.py --packages "$PACKAGES"

      - name: Upload race test reports and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: race-test-results-${{ matrix.shard_index }}
          path: race-results/
          if-no-files-found: ignore

  race-detection:
    name: '🔍 Race Detection'
    runs-on: ubuntu-24.04-arm
    needs: [plan-tests, prepare-build-cache, race-shards]
    if: always()
    steps:
      - name: '✅ Require every applicable race partition to pass'
        env:
          PLAN: ${{ needs.plan-tests.result }}
          CACHE: ${{ needs.prepare-build-cache.result }}
          HAS_GOROUTINES: ${{ needs.plan-tests.outputs.has-goroutines }}
          RESULT: ${{ needs.race-shards.result }}
          RUN_RACE: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false }}
        run: |
          test "$PLAN" = success
          if [ "$HAS_GOROUTINES" = true ] && [ "$RUN_RACE" = true ]; then
            test "$CACHE" = success
            test "$RESULT" = success
          fi
