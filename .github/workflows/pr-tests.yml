name: PR Tests

permissions:
  contents: read
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: 'Git ref to compare against (changed Go packages only)'
        required: true
        default: origin/main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '**/*.go'

concurrency:
  group: go-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOMAXPROCS: '1'
  GOFLAGS: '-p=1'
  TF_ACC: '0'
  PYTHONUNBUFFERED: '1'

jobs:
  unit-tests:
    name: '🧪 Go Unit Tests & Coverage'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    outputs:
      has-changes: ${{ steps.detect-changes.outputs.has-changes }}
      has-goroutines: ${{ steps.analyze-code.outputs.has-goroutines }}
      goroutine-packages: ${{ steps.analyze-code.outputs.goroutine-packages }}
      coverage-pct: ${{ steps.calculate-coverage.outputs.coverage-pct || steps.enforce-coverage.outputs.coverage-pct }}
      total-lines: ${{ steps.calculate-coverage.outputs.total-lines || steps.enforce-coverage.outputs.total-lines }}
      covered-lines: ${{ steps.calculate-coverage.outputs.covered-lines || steps.enforce-coverage.outputs.covered-lines }}
      service-domains: ${{ steps.analyze-code.outputs.service-domains }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          
      - name: Check Out  
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 📦 Detect changed packages
        id: detect-changes
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || inputs.base_ref }}
        run: |
          python3 scripts/pipeline/pr/steps/detect_changes.py --base-ref "$BASE_REF"

      - name: Set up Go
        if: steps.detect-changes.outputs.has-changes == 'true'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'
          cache: true

      - name: Check if PR is draft
        id: pr-state
        if: steps.detect-changes.outputs.has-changes == 'true'
        run: |
          if [ "${{ github.event.pull_request.draft }}" == "true" ]; then
            echo "is-draft=true" >> $GITHUB_OUTPUT
            echo "📝 PR is in draft state - tests are informational only"
          else
            echo "is-draft=false" >> $GITHUB_OUTPUT
            echo "✅ PR is ready for review - enforcing coverage threshold"
          fi

      - name: 📊 Analyze code patterns
        id: analyze-code
        if: steps.detect-changes.outputs.has-changes == 'true'
        run: |
          python3 scripts/pipeline/pr/steps/analyze_code.py \
            --packages "${{ steps.detect-changes.outputs.packages }}"

      - name: 🧪 Run unit tests
        id: tests
        if: steps.detect-changes.outputs.has-changes == 'true'
        env:
          PACKAGES: ${{ steps.detect-changes.outputs.packages }}
        run: |
          bash scripts/pipeline/pr/steps/monitor_resources.sh coverage/diagnostics \
            python3 scripts/pipeline/pr/steps/run_tests.py \
            --packages "$PACKAGES" --output-dir coverage

      - name: 📊 Calculate local coverage
        id: calculate-coverage
        if: steps.detect-changes.outputs.has-changes == 'true'
        run: |
          python3 scripts/pipeline/pr/steps/calculate_coverage.py \
            --coverage-file coverage/unit-coverage.txt

      - name: ⬆️ Upload coverage to Codecov
        if: |
          github.event_name == 'pull_request' &&
          steps.detect-changes.outputs.has-changes == 'true' &&
          steps.pr-state.outputs.is-draft == 'false'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/unit-coverage.txt
          flags: unittests,pr-changes
          name: pr-unit-coverage
          fail_ci_if_error: false
      
      - name: ✅ Enforce coverage threshold
        id: enforce-coverage
        if: |
          github.event_name == 'pull_request' &&
          steps.detect-changes.outputs.has-changes == 'true' &&
          steps.pr-state.outputs.is-draft == 'false'
        run: |
          python3 scripts/pipeline/pr/steps/enforce_coverage.py \
            --repo-slug "${{ github.repository }}" \
            --pr-number "${{ github.event.pull_request.number }}" \
            --codecov-token "${{ secrets.CODECOV_API_TOKEN }}"

      - name: 💬 Comment coverage summary on PR
        if: github.event_name == 'pull_request' && steps.detect-changes.outputs.has-changes == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const coveragePct = '${{ steps.calculate-coverage.outputs.coverage-pct || steps.enforce-coverage.outputs.coverage-pct }}';
            const totalLines = '${{ steps.calculate-coverage.outputs.total-lines || steps.enforce-coverage.outputs.total-lines }}';
            const coveredLines = '${{ steps.calculate-coverage.outputs.covered-lines || steps.enforce-coverage.outputs.covered-lines }}';
            const serviceDomains = '${{ steps.analyze-code.outputs.service-domains }}';
            const isDraft = '${{ steps.pr-state.outputs.is-draft }}' === 'true';
            const minThreshold = 60;
            
            const passEmoji = parseFloat(coveragePct) >= minThreshold ? '✅' : '❌';
            const statusText = isDraft 
              ? '📝 **Draft PR** - Coverage is informational only'
              : parseFloat(coveragePct) >= minThreshold
                ? `${passEmoji} **Coverage Passed** - Meets ${minThreshold}% threshold`
                : `${passEmoji} **Coverage Failed** - Below ${minThreshold}% threshold`;

            const body = `## 📊 Unit Test Coverage Report

            ${statusText}

            **Coverage for Changed Packages:** ${coveragePct}%

            - **Total Statements:** ${totalLines}
            - **Covered Statements:** ${coveredLines}
            - **Service Domains:** ${serviceDomains || 'N/A'}

            ${isDraft ? '> 💡 Mark PR as ready for review to enforce coverage threshold' : ''}
            ${parseFloat(coveragePct) < minThreshold && !isDraft ? `> ⚠️  Please add tests to reach ${minThreshold}% coverage` : ''}

            > Note: This is unit test coverage only. Full acceptance test coverage is run bi-weekly and includes integration with Microsoft Graph API.

            [View detailed coverage report on Codecov](https://codecov.io/gh/${{ github.repository }}/pull/${{ github.event.pull_request.number }})
            `;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Unit Test Coverage Report')
            );

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      - name: Upload unit test reports and diagnostics
        if: always() && steps.detect-changes.outputs.has-changes == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-results
          path: coverage/
          if-no-files-found: ignore

      - name: Summarize unit test failure
        if: failure() && steps.tests.outcome == 'failure'
        run: |
          echo 'Unit tests or compilation failed. See unit-test-results for the test output and runner diagnostics; coverage does not override test failures.' >> "$GITHUB_STEP_SUMMARY"

  race-detection:
    name: '🔍 Race Detection'
    runs-on: ubuntu-24.04-arm
    needs: unit-tests
    if: |
      needs.unit-tests.outputs.has-goroutines == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false)
    timeout-minutes: 60
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          
      - name: Check Out  
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'
          cache: true

      - name: 🔍 Run race detection
        env:
          PACKAGES: ${{ needs.unit-tests.outputs.goroutine-packages }}
        run: |
          bash scripts/pipeline/pr/steps/monitor_resources.sh race-results \
            python3 scripts/pipeline/pr/steps/run_race_detection.py --packages "$PACKAGES"

      - name: Upload race test reports and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: race-test-results
          path: race-results/
          if-no-files-found: ignore
