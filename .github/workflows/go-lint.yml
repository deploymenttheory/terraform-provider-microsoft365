name: go | Linter

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: 'Git ref to compare against (changed Go packages only)'
        required: true
        default: origin/main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '**/*.go'

permissions:
  contents: read

concurrency:
  group: go-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  golint:
    name: '✨ Run golangci-lint'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      GOMAXPROCS: '1'
      GOFLAGS: '-p=1'
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect changed Go packages
        id: changes
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || inputs.base_ref }}
        run: python3 scripts/pipeline/pr/steps/detect_changes.py --base-ref "$BASE_REF"

      - name: Set up Go
        if: steps.changes.outputs.has-changes == 'true'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          cache: true

      - name: Install golangci-lint
        if: steps.changes.outputs.has-changes == 'true'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          install-only: true

      - name: Validate lint configuration
        if: steps.changes.outputs.has-changes == 'true'
        run: golangci-lint config verify

      - name: Lint changed Go packages
        timeout-minutes: 30
        if: steps.changes.outputs.has-changes == 'true'
        env:
          BASE_SHA: ${{ steps.changes.outputs.base-sha }}
        run: |
          bash scripts/pipeline/pr/steps/monitor_resources.sh lint-results \
            python3 scripts/pipeline/pr/steps/run_lint.py --base-ref "$BASE_SHA"

      - name: Upload lint reports and diagnostics
        if: always() && steps.changes.outputs.has-changes == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-results
          path: lint-results/
          if-no-files-found: ignore

      - name: Summarize lint failure
        if: failure()
        run: |
          echo 'Lint failed. See the failing step and lint-results artifact: results.json distinguishes findings from execution failures; command.log contains compiler and linter diagnostics.' >> "$GITHUB_STEP_SUMMARY"
