name: go | Linter

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: 'Git ref to compare against (changed Go packages only)'
        required: true
        default: origin/main
      packages:
        description: 'Optional space-separated changed Go packages for a diagnostic run'
        required: false
        default: ''
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '**/*.go'
      - 'internal/**'
      - '.golangci.yml'
      - 'go.mod'
      - 'go.sum'
      - 'scripts/pipeline/**'
      - '.github/workflows/go-lint.yml'

permissions:
  contents: read

concurrency:
  group: go-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan-lint:
    name: '📋 Plan lint partitions'
    runs-on: ubuntu-24.04-arm
    outputs:
      has-changes: ${{ steps.plan.outputs.has-lint-changes }}
      base-sha: ${{ steps.plan.outputs.base-sha }}
      matrix: ${{ steps.plan.outputs.lint-matrix }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          cache: false

      - name: '🔎 Verify isolated test factories'
        run: |
          python3 -m unittest discover -s scripts/pipeline/tests -v
          python3 scripts/pipeline/generate_test_factories.py --check
          python3 -m unittest discover -s scripts/pipeline/pr/tests -p test_partitions.py -v

      - name: '📦 Detect changed packages and plan Go jobs'
        id: plan
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || inputs.base_ref }}
          LINT_PACKAGES: ${{ inputs.packages || '' }}
        run: |
          args=(--base-ref "$BASE_REF")
          if [[ -n "$LINT_PACKAGES" ]]; then
            args+=(--lint-packages "$LINT_PACKAGES")
          fi
          python3 scripts/pipeline/pr/steps/plan_jobs.py "${args[@]}"

  lint-shards:
    name: '✨ Lint ${{ matrix.label }}'
    needs: plan-lint
    if: needs.plan-lint.outputs.has-changes == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan-lint.outputs.matrix) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      GOMAXPROCS: '1'
      GOFLAGS: '-p=1'
      GOMEMLIMIT: ${{ matrix.gomemlimit }}
      GOGC: ${{ matrix.gogc }}
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          cache: true

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-only: true

      - name: Validate lint configuration
        run: golangci-lint config verify

      - name: '🔎 Verify changed-line lint reporting'
        run: python3 -m unittest discover -s scripts/pipeline/pr/tests -p test_go_lint.py -v

      - name: Lint changed Go packages
        timeout-minutes: 50
        env:
          PACKAGES: ${{ matrix.packages }}
          BASE_SHA: ${{ needs.plan-lint.outputs.base-sha }}
        run: |
          args=(--base-ref "$BASE_SHA" --packages "$PACKAGES")
          bash scripts/pipeline/pr/steps/monitor_resources.sh lint-results \
            python3 scripts/pipeline/pr/steps/run_lint.py "${args[@]}"

      - name: Upload lint reports and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-results-${{ matrix.shard_index }}
          path: lint-results/
          if-no-files-found: ignore

      - name: Summarize lint failure
        if: failure()
        run: |
          echo 'Lint failed. See the failing step and lint-results artifact: results.json distinguishes findings from execution failures; command.log contains compiler and linter diagnostics.' >> "$GITHUB_STEP_SUMMARY"

  golint:
    name: '✨ Run golangci-lint'
    runs-on: ubuntu-24.04-arm
    needs: [plan-lint, lint-shards]
    if: always()
    steps:
      - name: '✅ Require every lint partition to pass'
        env:
          PLAN: ${{ needs.plan-lint.result }}
          HAS_CHANGES: ${{ needs.plan-lint.outputs.has-changes }}
          RESULT: ${{ needs.lint-shards.result }}
        run: |
          test "$PLAN" = success
          if [ "$HAS_CHANGES" = true ]; then test "$RESULT" = success; fi
